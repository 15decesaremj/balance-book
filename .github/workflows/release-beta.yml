name: Publish signed Windows beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part version already committed on main
        required: true
        type: string
      release_notes:
        description: Concise reviewed beta release notes
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: signed-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    environment: public-release
    env:
      BALANCE_BOOK_UPDATES_ENABLED: '1'
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
      EXPECTED_PUBLISHER_THUMBPRINT: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER_THUMBPRINT }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify approved source and protected release settings
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Beta releases must run from main.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be numeric.' }
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) { throw 'Input version does not match package.json.' }
          if (git status --porcelain) { throw 'Release checkout is not clean.' }
          gh api "repos/${{ github.repository }}/immutable-releases" `
            -H 'X-GitHub-Api-Version: 2026-03-10' `
            --silent
          if ($LASTEXITCODE -ne 0) { throw 'Immutable GitHub releases are not enabled.' }
          gh release view "v$env:RELEASE_VERSION-beta" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This beta version already has a release.' }
      - name: Import protected signing material
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or
            [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER) -or
            [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER_THUMBPRINT)
          ) { throw 'Protected signing configuration is incomplete.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'balance-book-release.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV
      - name: Build and verify exact signed release
        shell: pwsh
        run: |
          ./tools/build-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -OfflineSquirrel
      - name: Assemble public software-only release
        id: assemble
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $major = $version.Split('.')[0]
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'balance-book-public-release'
          ./tools/assemble-public-release.ps1 `
            -SetupPath "out/make/squirrel.windows/x64/Balance Book-$version Setup.exe" `
            -UninstallerPath 'out/release-tools/windows-uninstaller/Uninstall Balance Book.exe' `
            -PackagedExecutablePath 'out/Balance Book-win32-x64/BalanceBook.exe' `
            -SquirrelArtifactDirectory 'out/make/squirrel.windows/x64' `
            -BuildMetadataPath "out/release-candidates/metadata/Balance Book V$major - $version.candidate.json" `
            -OutputDirectory $releaseRoot `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -ExpectedPublisherThumbprint $env:EXPECTED_PUBLISHER_THUMBPRINT `
            -Channel beta
          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.assemble.outputs.release_root }}/*
      - name: Create, verify, and publish immutable beta
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version-beta"
          $releaseRoot = '${{ steps.assemble.outputs.release_root }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText(
            $notesPath,
            "Balance Book $version Beta`n`n$env:RELEASE_NOTES`n",
            [Text.UTF8Encoding]::new($false)
          )
          $assets = @(Get-ChildItem -LiteralPath $releaseRoot -File | ForEach-Object FullName)
          gh release create $tag @assets `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Balance Book $version Beta" `
            --notes-file $notesPath `
            --draft `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

          $fresh = Join-Path $env:RUNNER_TEMP 'fresh-release-download'
          New-Item -ItemType Directory -Path $fresh | Out-Null
          gh release download $tag --repo '${{ github.repository }}' --dir $fresh
          if ($LASTEXITCODE -ne 0) { throw 'Fresh draft download failed.' }
          $expected = @(Get-ChildItem -LiteralPath $releaseRoot -File | Sort-Object Name)
          $actual = @(Get-ChildItem -LiteralPath $fresh -File | Sort-Object Name)
          if (($expected.Name -join "`n") -ne ($actual.Name -join "`n")) {
            throw 'Fresh release asset names do not match the assembled set.'
          }
          foreach ($file in $expected) {
            $download = Join-Path $fresh $file.Name
            if (
              (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $download).Hash
            ) { throw "Fresh release hash mismatch: $($file.Name)" }
          }
          foreach ($executable in @(Get-ChildItem -LiteralPath $fresh -Filter '*.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if (
              $signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -cne $env:EXPECTED_PUBLISHER -or
              $signature.SignerCertificate.Thumbprint -ine $env:EXPECTED_PUBLISHER_THUMBPRINT.Replace(' ', '') -or
              -not $signature.TimeStamperCertificate
            ) { throw "Fresh release signature validation failed: $($executable.Name)" }
          }
          gh release edit $tag --repo '${{ github.repository }}' --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" `
            -H 'X-GitHub-Api-Version: 2026-03-10' | ConvertFrom-Json
          if (-not $release.immutable -or $release.draft -or -not $release.prerelease) {
            throw 'Published beta is not an immutable prerelease.'
          }
      - name: Stage verified beta feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-beta-feed
          path: ${{ steps.assemble.outputs.release_root }}/RELEASES
          if-no-files-found: error
          retention-days: 7

  deploy-feed:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-beta-feed
          path: _feed
      - name: Build static update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/updates/beta/win32/x64
          cp site/index.html _site/index.html
          cp _feed/RELEASES _site/updates/beta/win32/x64/RELEASES
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
