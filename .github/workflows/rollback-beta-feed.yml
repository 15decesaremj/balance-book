name: Roll back beta update feed

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable beta tag to restore, such as v2.0.6-beta
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download and validate immutable release feed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]
          immutable="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" -H 'X-GitHub-Api-Version: 2026-03-10' --jq '.immutable')"
          prerelease="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq '.prerelease')"
          draft="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq '.draft')"
          [[ "$immutable" == "true" && "$prerelease" == "true" && "$draft" == "false" ]]
          mkdir feed package
          gh release download "$RELEASE_TAG" \
            --repo '${{ github.repository }}' \
            --pattern RELEASES \
            --dir feed
          package_name="$(awk 'NF {print $2; exit}' feed/RELEASES | sed 's#^.*/##')"
          expected_sha1="$(awk 'NF {print toupper($1); exit}' feed/RELEASES)"
          expected_size="$(awk 'NF {print $3; exit}' feed/RELEASES)"
          [[ "$package_name" =~ ^balance_book_mvp-[0-9]+\.[0-9]+\.[0-9]+-full\.nupkg$ ]]
          gh release download "$RELEASE_TAG" \
            --repo '${{ github.repository }}' \
            --pattern "$package_name" \
            --dir package
          actual_sha1="$(sha1sum "package/$package_name" | awk '{print toupper($1)}')"
          actual_size="$(stat -c '%s' "package/$package_name")"
          [[ "$actual_sha1" == "$expected_sha1" && "$actual_size" == "$expected_size" ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-beta-rollback-feed
          path: feed/RELEASES
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-beta-rollback-feed
          path: _feed
      - name: Build rollback site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/updates/beta/win32/x64
          cp site/index.html _site/index.html
          cp _feed/RELEASES _site/updates/beta/win32/x64/RELEASES
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy last known-good feed
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
