name: Verify Windows desktop app

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Electron's native rebuild toolchain supports Visual Studio 2022; the current
    # windows-latest image has moved to Visual Studio 2026 ahead of node-gyp support.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm privacy:check
      - run: pnpm build
      - run: ./tools/packaged-smoke.ps1
      - run: pnpm test:e2e
